basePath: /
definitions:
  request.CancelTaskReq:
    properties:
      cancel_reason:
        type: string
      liquidation_id:
        type: string
      requested_at:
        type: integer
      sign:
        example: a1b2...
        type: string
      timestamp:
        example: 1757923200123
        type: integer
    required:
    - cancel_reason
    - liquidation_id
    - requested_at
    - sign
    - timestamp
    type: object
  request.CreateTaskReq:
    properties:
      trigger_collateral_qty:
        type: string
      trigger_collateral_asset:
        type: string
      liquidation_id:
        type: string
      loan_order_id:
        type: string
      original_ratio:
        type: string
      sign:
        description: hex_lower(HMAC-SHA256(app_secret, 待签名字符串))
        example: a1b2...
        type: string
      symbol:
        description: Symbol Binance 现货交易对（执行所需，参与 sign）
        type: string
      timestamp:
        description: 毫秒时间戳，参与 sign
        example: 1757923200123
        type: integer
      trigger_collateral_due_amount:
        type: string
      trigger_mark_price:
        type: string
      trigger_ratio:
        type: string
      uid:
        type: string
    required:
    - trigger_collateral_qty
    - trigger_collateral_asset
    - liquidation_id
    - loan_order_id
    - original_ratio
    - sign
    - symbol
    - timestamp
    - trigger_collateral_due_amount
    - trigger_mark_price
    - trigger_ratio
    - uid
    type: object
  request.LiquidationTaskNotifyReq:
    properties:
      avg_price:
        type: string
      callback_status:
        type: string
      fills:
        items:
          $ref: '#/definitions/response.FillItem'
        type: array
      liquidation_id:
        type: string
      loan_order_id:
        type: string
      remaining_collateral_qty:
        type: string
      remaining_debt_amount:
        type: string
      sign:
        type: string
      status:
        type: string
      symbol:
        type: string
      timestamp:
        type: integer
      total_amount:
        type: string
      total_fee:
        type: string
      total_net_proceeds_amount:
        type: string
      total_qty:
        type: string
    type: object
  response.ApiResp:
    properties:
      code:
        description: 业务码，200 表示成功
        type: integer
      data:
        description: 业务数据，失败时可为 null
      message:
        description: 提示信息
        type: string
    type: object
  response.BeTrustLiquidationCallbackResp:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  response.CancelTaskResp:
    properties:
      cancel_result:
        description: accepted | already_finished | rejected
        type: string
      message:
        type: string
    type: object
  response.CreateTaskResp:
    properties:
      result:
        description: accepted | rejected
        type: string
      result_message:
        description: 结果说明
        type: string
    type: object
  response.FillItem:
    properties:
      amount:
        type: string
      batch_no:
        type: string
      exchange_trade_id:
        type: string
      fee:
        type: string
      fee_asset:
        type: string
      price:
        type: string
      quantity:
        type: string
      trade_time_ms:
        type: integer
    type: object
  response.GetTaskResp:
    properties:
      avg_price:
        type: string
      callback_status:
        type: string
      fills:
        items:
          $ref: '#/definitions/response.FillItem'
        type: array
      liquidation_id:
        type: string
      loan_order_id:
        type: string
      remaining_collateral_qty:
        type: string
      remaining_debt_amount:
        type: string
      status:
        type: string
      symbol:
        type: string
      total_amount:
        type: string
      total_fee:
        type: string
      total_net_proceeds_amount:
        type: string
      total_qty:
        type: string
    type: object
info:
  contact: {}
  description: 质押清算策略服务（BeTrust 触发 / 查询 / 取消；鉴权见 docs/api.md）
  title: mojo-strategy-liquidation API
  version: "1.0"
paths:
  /betrust/contract/liquidation/callback:
    post:
      consumes:
      - application/json
      description: 生产环境由本服务 callback 脚本 POST 到 BeTrust 配置的 callback_url；此路由仅在本服务 Swagger
        中展示请求/响应格式，便于对方对接。
      parameters:
      - description: 强平结果（与查询接口 data 同结构 + timestamp/sign）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.LiquidationTaskNotifyReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BeTrustLiquidationCallbackResp'
      summary: 接收强平结果回调（BeTrust 需实现）
      tags:
      - betrust-contract
  /liquidation/tasks:
    get:
      parameters:
      - description: 强平任务 ID（参与 sign）
        in: query
        name: liquidation_id
        required: true
        type: string
      - description: 毫秒时间戳
        in: query
        name: timestamp
        required: true
        type: integer
      - description: HMAC 签名
        in: query
        name: sign
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResp'
            - properties:
                data:
                  $ref: '#/definitions/response.GetTaskResp'
              type: object
      summary: 查询强平任务
      tags:
      - liquidation-task
    post:
      consumes:
      - application/json
      description: BeTrust 下发强平信号；liquidation_id 幂等。body 须含 timestamp、sign，见 docs/api.md
        鉴权章节。
      parameters:
      - description: 触发参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.CreateTaskReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResp'
            - properties:
                data:
                  $ref: '#/definitions/response.CreateTaskResp'
              type: object
      summary: 触发强平任务
      tags:
      - liquidation-task
  /liquidation/tasks/cancel:
    post:
      consumes:
      - application/json
      description: 停止后续卖出；已在途 IOC 由服务撤单
      parameters:
      - description: 取消参数（含 liquidation_id、timestamp、sign）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.CancelTaskReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResp'
            - properties:
                data:
                  $ref: '#/definitions/response.CancelTaskResp'
              type: object
      summary: 取消强平任务
      tags:
      - liquidation-task
swagger: "2.0"
